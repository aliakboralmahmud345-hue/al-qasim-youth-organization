
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>আল ক্বাসিম ইসলামি যুব সংঘ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,sans-serif}
header{background:#075b45;color:white;text-align:center;padding:20px}
main{max-width:950px;margin:25px auto;padding:15px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
h2{color:#075b45;margin-top:0}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #cbd5e1;border-radius:7px;font-size:16px}
button{background:#087653;color:white;border:0;cursor:pointer}
.secondary{background:#475569}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:#ecfdf5;padding:18px;border-radius:9px;text-align:center}
.stat strong{display:block;font-size:23px;color:#075b45;margin-top:8px}
.hidden{display:none}
.item{border-bottom:1px solid #e2e8f0;padding:12px 0}
.small{font-size:13px;color:#64748b}
.message{padding:8px}
</style>
</head>
<body>
<header>
<h2 style="color:white">আল ক্বাসিম ইসলামি যুব সংঘ</h2>
<p>সংগঠনের হিসাব ব্যবস্থাপনা</p>
</header>
<main>

<section class="card" id="loginBox">
<h2>অ্যাডমিন লগইন</h2>
<input id="email" type="email" placeholder="ইমেইল">
<input id="password" type="password" placeholder="পাসওয়ার্ড">
<button id="loginBtn">লগইন করুন</button>
<button class="secondary" id="forgotBtn">পাসওয়ার্ড ভুলে গেছেন?</button>
<div id="message" class="message"></div>
</section>

<section class="card hidden" id="recoveryBox">
<h2>নতুন পাসওয়ার্ড দিন</h2>
<input id="newPassword" type="password" placeholder="নতুন পাসওয়ার্ড">
<button id="savePasswordBtn">পাসওয়ার্ড পরিবর্তন করুন</button>
<div id="recoveryMessage" class="message"></div>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h2>ড্যাশবোর্ড</h2>
<p>স্বাগতম: <span id="userEmail"></span></p>
<button class="secondary" id="logoutBtn">লগআউট</button>
<div class="grid">
<div class="stat">মোট সদস্য<strong id="memberCount">০</strong></div>
<div class="stat">মোট চাঁদা<strong id="duesTotal">৳ ০</strong></div>
<div class="stat">মোট জমা<strong id="income">৳ ০</strong></div>
<div class="stat">মোট খরচ<strong id="expense">৳ ০</strong></div>
</div>
</div>

<div class="card">
<h2>নতুন সদস্য যোগ করুন</h2>
<form id="memberForm">
<input id="fullName" required placeholder="সদস্যের নাম">
<input id="fatherName" placeholder="পিতার নাম">
<input id="phone" placeholder="মোবাইল নম্বর">
<input id="address" placeholder="ঠিকানা">
<label>যোগদানের তারিখ</label>
<input id="joiningDate" type="date" required>
<button type="submit">সদস্য সংরক্ষণ করুন</button>
</form>
<div id="memberMessage" class="message"></div>
</div>

<div class="card">
<h2>মাসিক চাঁদা জমা করুন</h2>
<form id="duesForm">
<label>সদস্য নির্বাচন করুন</label>
<select id="duesMember" required>
<option value="">সদস্য নির্বাচন করুন</option>
</select>
<label>কোন মাসের চাঁদা</label>
<input id="paymentMonth" type="month" required>
<label>চাঁদার পরিমাণ (টাকা)</label>
<input id="duesAmount" type="number" min="1" step="0.01" required placeholder="যেমন: ১০০">
<label>জমার তারিখ</label>
<input id="paidDate" type="date" required>
<button type="submit">চাঁদা জমা সংরক্ষণ করুন</button>
</form>
<div id="duesMessage" class="message"></div>
</div>

<div class="card">
<h2>সদস্য তালিকা</h2>
<div id="memberList">লোড হচ্ছে...</div>
</div>

<div class="card">
<h2>চাঁদা জমার তালিকা</h2>
<label>মাস অনুযায়ী দেখুন</label>
<input id="filterMonth" type="month">
<div id="duesList">লোড হচ্ছে...</div>
</div>
</section>
</main>

<script>
// আগের ফাইলের একই Supabase URL ও Publishable Key বসাবেন
const SUPABASE_URL = "https://tlwygxvvoxamilynhicf.supabase.co";
const SUPABASE_KEY = "sb_publishable_sqPsAmbN1M-DcGNS3OOZLw_AYnnfkFv";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const el = id => document.getElementById(id);

let currentUser = null;
let organizationId = null;
let members = [];

function msg(id,text,error=true){
  el(id).textContent=text;
  el(id).style.color=error?"#b42318":"#087653";
}

function showDashboard(){
  el("loginBox").classList.add("hidden");
  el("recoveryBox").classList.add("hidden");
  el("dashboard").classList.remove("hidden");
}

function showLogin(){
  el("dashboard").classList.add("hidden");
  el("recoveryBox").classList.add("hidden");
  el("loginBox").classList.remove("hidden");
}

async function loadProfile(user){
  currentUser=user;
  const {data,error}=await db.from("profiles")
    .select("organization_id,role")
    .eq("id",user.id).maybeSingle();

  if(error || !data){
    msg("message","প্রোফাইল পাওয়া যায়নি: "+(error?.message||"তথ্য নেই"));
    return;
  }

  organizationId=data.organization_id;
  el("userEmail").textContent=user.email||"";
  showDashboard();
  await loadMembers();
  await loadDues();
  await loadSummary();
}

async function login(){
  msg("message","লগইন হচ্ছে...",false);
  const {data,error}=await db.auth.signInWithPassword({
    email:el("email").value.trim(),
    password:el("password").value
  });
  if(error){msg("message","লগইন হয়নি: "+error.message);return;}
  await loadProfile(data.user);
}

el("loginBtn").addEventListener("click",login);

el("forgotBtn").addEventListener("click",async()=>{
  const email=el("email").value.trim();
  if(!email){msg("message","আগে ইমেইল লিখুন।");return;}
  const {error}=await db.auth.resetPasswordForEmail(email,{
    redirectTo:window.location.origin+window.location.pathname
  });
  if(error)msg("message",error.message);
  else msg("message","ইমেইলে পাসওয়ার্ড পরিবর্তনের লিংক পাঠানো হয়েছে।",false);
});

el("savePasswordBtn").addEventListener("click",async()=>{
  const password=el("newPassword").value;
  if(password.length<6){msg("recoveryMessage","কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন।");return;}
  const {error}=await db.auth.updateUser({password});
  if(error)msg("recoveryMessage",error.message);
  else msg("recoveryMessage","পাসওয়ার্ড পরিবর্তন হয়েছে।",false);
});

db.auth.onAuthStateChange(async(event,session)=>{
  if(event==="PASSWORD_RECOVERY"){
    el("loginBox").classList.add("hidden");
    el("dashboard").classList.add("hidden");
    el("recoveryBox").classList.remove("hidden");
    return;
  }
  if(session && !currentUser && event==="SIGNED_IN"){
    await loadProfile(session.user);
  }
});

async function loadMembers(){
  const {data,error}=await db.from("members")
    .select("id,full_name,father_name,phone,address,joining_date")
    .eq("organization_id",organizationId)
    .order("joining_date",{ascending:false});

  if(error){el("memberList").textContent=error.message;return;}
  members=data||[];
  el("memberCount").textContent=members.length.toLocaleString("bn-BD");

  const select=el("duesMember");
  select.replaceChildren();
  const first=document.createElement("option");
  first.value="";
  first.textContent="সদস্য নির্বাচন করুন";
  select.appendChild(first);

  members.forEach(m=>{
    const option=document.createElement("option");
    option.value=m.id;
    option.textContent=m.full_name;
    select.appendChild(option);
  });

  const list=el("memberList");
  list.replaceChildren();
  if(!members.length){list.textContent="এখনো সদস্য যোগ করা হয়নি।";return;}

  members.forEach(m=>{
    const item=document.createElement("div");
    item.className="item";
    const name=document.createElement("strong");
    name.textContent=m.full_name;
    const detail=document.createElement("div");
    detail.className="small";
    detail.textContent="পিতা: "+(m.father_name||"—")+" | মোবাইল: "+(m.phone||"—")+" | ঠিকানা: "+(m.address||"—");
    item.append(name,detail);
    list.appendChild(item);
  });
}

el("memberForm").addEventListener("submit",async event=>{
  event.preventDefault();
  const member={
    organization_id:organizationId,
    full_name:el("fullName").value.trim(),
    father_name:el("fatherName").value.trim(),
    phone:el("phone").value.trim(),
    address:el("address").value.trim(),
    joining_date:el("joiningDate").value
  };
  const {error}=await db.from("members").insert(member);
  if(error){msg("memberMessage","সংরক্ষণ হয়নি: "+error.message);return;}
  msg("memberMessage","সদস্য সফলভাবে যোগ হয়েছে।",false);
  el("memberForm").reset();
  await loadMembers();
});

el("duesForm").addEventListener("submit",async event=>{
  event.preventDefault();

  const month=el("paymentMonth").value;
  if(!month){msg("duesMessage","মাস নির্বাচন করুন।");return;}

  const payment={
    organization_id:organizationId,
    member_id:el("duesMember").value,
    payment_month:month+"-01",
    amount:Number(el("duesAmount").value),
    paid_date:el("paidDate").value
  };

  const {error}=await db.from("monthly_dues").insert(payment);

  if(error){
    if(error.code==="23505"){
      msg("duesMessage","এই সদস্যের এই মাসের চাঁদা আগে জমা হয়েছে।");
    }else{
      msg("duesMessage","চাঁদা সংরক্ষণ হয়নি: "+error.message);
    }
    return;
  }

  msg("duesMessage","চাঁদা সফলভাবে জমা হয়েছে।",false);
  el("duesForm").reset();
  await loadDues();
  await loadSummary();
});

async function loadDues(){
  let query=db.from("monthly_dues")
    .select("id,member_id,payment_month,amount,paid_date")
    .eq("organization_id",organizationId)
    .order("paid_date",{ascending:false});

  const filter=el("filterMonth").value;
  if(filter){
    query=query.eq("payment_month",filter+"-01");
  }

  const {data,error}=await query;
  const list=el("duesList");
  list.replaceChildren();

  if(error){list.textContent="চাঁদার তালিকা পাওয়া যায়নি: "+error.message;return;}

  if(!data.length){list.textContent="এই মাসে কোনো চাঁদা জমা নেই।";return;}

  data.forEach(row=>{
    const member=members.find(m=>m.id===row.member_id);
    const item=document.createElement("div");
    item.className="item";

    const name=document.createElement("strong");
    name.textContent=member?member.full_name:"সদস্য";
    const detail=document.createElement("div");
    detail.className="small";
    detail.textContent=
      "মাস: "+row.payment_month.slice(0,7)+
      " | জমা: ৳ "+Number(row.amount).toLocaleString("bn-BD")+
      " | তারিখ: "+row.paid_date;

    item.append(name,detail);
    list.appendChild(item);
  });
}

el("filterMonth").addEventListener("change",loadDues);

async function loadSummary(){
  const {data,error}=await db.from("monthly_dues")
    .select("amount")
    .eq("organization_id",organizationId);

  if(!error && data){
    const total=data.reduce((sum,row)=>sum+Number(row.amount||0),0);
    el("duesTotal").textContent="৳ "+total.toLocaleString("bn-BD");
  }

  const result=await db.from("transactions")
    .select("amount,type")
    .eq("organization_id",organizationId);

  if(result.error || !result.data)return;

  let income=0,expense=0;
  result.data.forEach(row=>{
    const amount=Number(row.amount)||0;
    const type=String(row.type||"").toLowerCase();
    if(type.includes("expense")||type.includes("খরচ"))expense+=amount;
    else income+=amount;
  });
  el("income").textContent="৳ "+income.toLocaleString("bn-BD");
  el("expense").textContent="৳ "+expense.toLocaleString("bn-BD");
}

el("logoutBtn").addEventListener("click",async()=>{
  await db.auth.signOut();
  currentUser=null;
  organizationId=null;
  showLogin();
});

(async()=>{
  const {data}=await db.auth.getSession();
  if(data.session)await loadProfile(data.session.user);
})();
</script>
</body>
</html>
