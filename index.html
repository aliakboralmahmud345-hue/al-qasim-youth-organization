
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আল ক্বাসিম ইসলামি যুব সংঘ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #1e293b;
    }
    .container {
      max-width: 650px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px #0001;
    }
    h2, h3 { text-align: center; color: #166534; }
    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      background: #15803d;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button:hover { background: #166534; }
    .link {
      color: #2563eb;
      cursor: pointer;
      text-align: center;
    }
    .hidden { display: none; }
    .message { text-align: center; margin: 12px 0; }
    .card {
      background: #f0fdf4;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
    }
    .amount { font-size: 22px; font-weight: bold; }
    .item {
      padding: 10px;
      border-bottom: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>আল ক্বাসিম ইসলামি যুব সংঘ</h2>
  <p style="text-align:center">হিসাব ব্যবস্থাপনা</p>

  <div id="loginBox">
    <h3>লগইন করুন</h3>
    <input id="email" type="email" placeholder="আপনার ইমেইল">
    <input id="password" type="password" placeholder="পাসওয়ার্ড">

    <select id="role">
      <option value="super_admin">সুপার অ্যাডমিন</option>
      <option value="org_admin">সংগঠন অ্যাডমিন</option>
      <option value="member">সদস্য</option>
    </select>

    <button id="loginBtn">লগইন</button>
    <p class="link" id="forgotBtn">পাসওয়ার্ড ভুলে গেছেন?</p>
  </div>

  <div id="forgotBox" class="hidden">
    <h3>পাসওয়ার্ড রিসেট</h3>
    <input id="resetEmail" type="email" placeholder="আপনার ইমেইল">
    <button id="sendResetBtn">রিসেট লিংক পাঠান</button>
    <p class="link" id="backBtn">লগইনে ফিরে যান</p>
  </div>

  <div id="newPasswordBox" class="hidden">
    <h3>নতুন পাসওয়ার্ড দিন</h3>
    <input id="newPassword" type="password" placeholder="নতুন পাসওয়ার্ড">
    <input id="confirmPassword" type="password" placeholder="আবার পাসওয়ার্ড দিন">
    <button id="savePasswordBtn">পাসওয়ার্ড পরিবর্তন করুন</button>
  </div>

  <div id="dashboard" class="hidden">
    <h3>হিসাবের ড্যাশবোর্ড</h3>
    <p id="welcome"></p>

    <div class="card">
      মোট জমা
      <div class="amount" id="totalIncome">৳ ০</div>
    </div>
    <div class="card">
      মোট খরচ
      <div class="amount" id="totalExpense">৳ ০</div>
    </div>
    <div class="card">
      অবশিষ্ট টাকা
      <div class="amount" id="balance">৳ ০</div>
    </div>

    <h3>সদস্য সংখ্যা</h3>
    <div class="card amount" id="memberCount">লোড হচ্ছে...</div>

    <h3>সাম্প্রতিক লেনদেন</h3>
    <div id="transactionList">লোড হচ্ছে...</div>

    <button id="logoutBtn">লগআউট</button>
  </div>

  <p id="message" class="message"></p>
</div>

<script>
  // এখানে আপনার আগের Supabase URL ও Publishable/Anon Key বসান
  const SUPABASE_URL =  "https://tlwygxvvoxamilynhicf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_sqPsAmbN1M-DcGNS3OOZLw_AYnnfkFv";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const $ = id => document.getElementById(id);
  const message = $("message");

  function showBox(id) {
    ["loginBox", "forgotBox", "newPasswordBox", "dashboard"]
      .forEach(box => $(box).classList.add("hidden"));

    $(id).classList.remove("hidden");
    message.textContent = "";
  }

  function money(value) {
    return "৳ " + Number(value || 0).toLocaleString("en-IN");
  }

  $("forgotBtn").onclick = () => showBox("forgotBox");
  $("backBtn").onclick = () => showBox("loginBox");

  $("sendResetBtn").onclick = async () => {
    const email = $("resetEmail").value.trim();

    if (!email) {
      message.textContent = "ইমেইল লিখুন।";
      return;
    }

    message.textContent = "লিংক পাঠানো হচ্ছে...";

    try {
      const { error } = await db.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname
      });

      message.textContent = error
        ? "সমস্যা: " + error.message
        : "ইমেইল চেক করুন। রিসেট লিংক পাঠানো হয়েছে।";
    } catch (err) {
      message.textContent = "সমস্যা: " + err.message;
    }
  };

  db.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
      showBox("newPasswordBox");
    }
  });

  $("savePasswordBtn").onclick = async () => {
    const password = $("newPassword").value;
    const confirm = $("confirmPassword").value;

    if (password.length < 6) {
      message.textContent = "কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন।";
      return;
    }

    if (password !== confirm) {
      message.textContent = "দুটি পাসওয়ার্ড মিলছে না।";
      return;
    }

    const { error } = await db.auth.updateUser({ password });

    if (error) {
      message.textContent = "সমস্যা: " + error.message;
      return;
    }

    await db.auth.signOut();
    $("newPassword").value = "";
    $("confirmPassword").value = "";
    showBox("loginBox");
    message.style.color = "green";
    message.textContent = "পাসওয়ার্ড পরিবর্তন হয়েছে। এখন লগইন করুন।";
  };

  async function loadDashboard(user) {
    const { data: profile, error } = await db
      .from("profiles")
      .select("role, organization_id")
      .eq("id", user.id)
      .single();

    if (error || !profile) {
      message.textContent = "প্রোফাইল পাওয়া যায়নি। Supabase profiles টেবিল পরীক্ষা করুন।";
      await db.auth.signOut();
      return;
    }

    const selectedRole = $("role").value;

    if (profile.role !== selectedRole) {
      message.textContent = "আপনার অ্যাকাউন্টের ধরন সঠিক নয়।";
      await db.auth.signOut();
      return;
    }

    if (!profile.organization_id) {
      message.textContent = "এই অ্যাকাউন্টের সঙ্গে সংগঠন যুক্ত নেই।";
      await db.auth.signOut();
      return;
    }

    $("welcome").textContent = "লগইন সফল হয়েছে। ভূমিকা: " + profile.role;
    showBox("dashboard");
    message.textContent = "হিসাব লোড হচ্ছে...";

    const orgId = profile.organization_id;

    const { data: transactions, error: txError } = await db
      .from("transactions")
      .select("transaction_type, amount, description, transaction_date")
      .eq("organization_id", orgId)
      .order("transaction_date", { ascending: false });

    if (txError) {
      message.textContent = "লেনদেন লোড হয়নি: " + txError.message;
      return;
    }

    let income = 0;
    let expense = 0;

    (transactions || []).forEach(item => {
      const amount = Number(item.amount || 0);
      if (item.transaction_type === "income") income += amount;
      if (item.transaction_type === "expense") expense += amount;
    });

    $("totalIncome").textContent = money(income);
    $("totalExpense").textContent = money(expense);
    $("balance").textContent = money(income - expense);

    const { count, error: memberError } = await db
      .from("members")
      .select("*", { count: "exact", head: true })
      .eq("organization_id", orgId);

    $("memberCount").textContent = memberError
      ? "লোড করা যায়নি"
      : (count ?? 0) + " জন";

    $("transactionList").innerHTML = "";

    if (!transactions || transactions.length === 0) {
      $("transactionList").textContent = "এখনো কোনো লেনদেন নেই।";
    } else {
      transactions.slice(0, 10).forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.textContent =
          (item.description || "লেনদেন") + " — " +
          money(item.amount) + " — " +
          (item.transaction_date || "");
        $("transactionList").appendChild(div);
      });
    }

    message.textContent = "";
  }

  $("loginBtn").onclick = async () => {
    const email = $("email").value.trim();
    const password = $("password").value;

    if (!email || !password) {
      message.textContent = "ইমেইল ও পাসওয়ার্ড লিখুন।";
      return;
    }

    message.textContent = "লগইন হচ্ছে...";

    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      message.textContent = "লগইন হয়নি: " + error.message;
      return;
    }

    await loadDashboard(data.user);
  };

  $("logoutBtn").onclick = async () => {
    await db.auth.signOut();
    showBox("loginBox");
    message.textContent = "আপনি লগআউট করেছেন।";
  };
</script>

</body>
</html>
