
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আল ক্বাসিম ইসলামি যুব সংঘ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#075b45;color:white;padding:20px;text-align:center}
main{max-width:950px;margin:25px auto;padding:15px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 10px #0000000c}
h2{margin-top:0;color:#075b45}
input,button{width:100%;padding:12px;margin:7px 0;border-radius:7px;font-size:16px}
input{border:1px solid #cbd5e1}
button{border:0;background:#087653;color:white;cursor:pointer}
button:hover{background:#064e3b}
.secondary{background:#475569}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:#ecfdf5;padding:18px;border-radius:9px;text-align:center}
.stat strong{display:block;font-size:25px;color:#075b45;margin-top:8px}
.hidden{display:none}
.member{border-bottom:1px solid #e2e8f0;padding:12px 0}
.small{font-size:13px;color:#64748b}
#message{padding:10px;color:#b42318}
</style>
</head>
<body>
<header>
<h2 style="color:white;margin:0">আল ক্বাসিম ইসলামি যুব সংঘ</h2>
<p>সংগঠনের হিসাব ব্যবস্থাপনা</p>
</header>

<main>
<section class="card" id="loginBox">
<h2>অ্যাডমিন লগইন</h2>
<input id="email" type="email" placeholder="আপনার ইমেইল">
<input id="password" type="password" placeholder="পাসওয়ার্ড">
<button id="loginBtn">লগইন করুন</button>
<button class="secondary" id="forgotBtn">পাসওয়ার্ড ভুলে গেছেন?</button>
<div id="message"></div>
</section>

<section class="card hidden" id="recoveryBox">
<h2>নতুন পাসওয়ার্ড দিন</h2>
<input id="newPassword" type="password" placeholder="নতুন পাসওয়ার্ড">
<button id="savePasswordBtn">পাসওয়ার্ড পরিবর্তন করুন</button>
<div id="recoveryMessage"></div>
</section>

<section class="hidden" id="dashboard">
<div class="card">
<h2>ড্যাশবোর্ড</h2>
<p>স্বাগতম! <span id="userEmail"></span></p>
<button class="secondary" id="logoutBtn">লগআউট</button>
<div class="grid">
<div class="stat">মোট সদস্য<strong id="memberCount">০</strong></div>
<div class="stat">মোট জমা<strong id="income">৳ ০</strong></div>
<div class="stat">মোট খরচ<strong id="expense">৳ ০</strong></div>
</div>
</div>

<div class="card">
<h2>নতুন সদস্য যোগ করুন</h2>
<form id="memberForm">
<input id="fullName" required placeholder="সদস্যের নাম">
<input id="fatherName" placeholder="পিতার নাম">
<input id="phone" placeholder="মোবাইল নম্বর">
<input id="address" placeholder="ঠিকানা">
<label>যোগদানের তারিখ</label>
<input id="joiningDate" type="date" required>
<button type="submit">সদস্য সংরক্ষণ করুন</button>
</form>
<div id="memberMessage"></div>
</div>

<div class="card">
<h2>সদস্য তালিকা</h2>
<div id="memberList">লোড হচ্ছে...</div>
</div>
</section>
</main>

<script>
// আপনার আগের index.html থেকে এই দুটি মান বসাবেন
const SUPABASE_URL = "https://tlwygxvvoxamilynhicf.supabase.co";
const SUPABASE_KEY = "sb_publishable_sqPsAmbN1M-DcGNS3OOZLw_AYnnfkFv";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let organizationId = null;

const el = id => document.getElementById(id);

function showMessage(id, message, isError=true) {
  el(id).textContent = message;
  el(id).style.color = isError ? "#b42318" : "#087653";
}

function showDashboard() {
  el("loginBox").classList.add("hidden");
  el("recoveryBox").classList.add("hidden");
  el("dashboard").classList.remove("hidden");
}

function showLogin() {
  el("dashboard").classList.add("hidden");
  el("recoveryBox").classList.add("hidden");
  el("loginBox").classList.remove("hidden");
}

async function loadProfile(user) {
  currentUser = user;

  const {data, error} = await db
    .from("profiles")
    .select("organization_id, role")
    .eq("id", user.id)
    .maybeSingle();

  if (error || !data) {
    showMessage("message", "আপনার প্রোফাইল পাওয়া যায়নি। Supabase-এর profiles টেবিল পরীক্ষা করুন।");
    return;
  }

  organizationId = data.organization_id;
  el("userEmail").textContent = user.email || "";
  showDashboard();
  await loadMembers();
  await loadSummary();
}

async function login() {
  showMessage("message", "লগইন হচ্ছে...", false);

  const email = el("email").value.trim();
  const password = el("password").value;

  const {data, error} = await db.auth.signInWithPassword({email, password});

  if (error) {
    showMessage("message", "লগইন হয়নি: " + error.message);
    return;
  }

  await loadProfile(data.user);
}

el("loginBtn").addEventListener("click", login);

el("forgotBtn").addEventListener("click", async () => {
  const email = el("email").value.trim();

  if (!email) {
    showMessage("message", "আগে আপনার ইমেইল লিখুন।");
    return;
  }

  const {error} = await db.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });

  if (error) {
    showMessage("message", error.message);
  } else {
    showMessage("message", "আপনার ইমেইলে পাসওয়ার্ড পরিবর্তনের লিংক পাঠানো হয়েছে।", false);
  }
});

el("savePasswordBtn").addEventListener("click", async () => {
  const password = el("newPassword").value;

  if (password.length < 6) {
    showMessage("recoveryMessage", "কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন।");
    return;
  }

  const {error} = await db.auth.updateUser({password});

  if (error) {
    showMessage("recoveryMessage", error.message);
  } else {
    showMessage("recoveryMessage", "পাসওয়ার্ড পরিবর্তন হয়েছে। এখন লগইন করতে পারবেন।", false);
  }
});

db.auth.onAuthStateChange(async (event, session) => {
  if (event === "PASSWORD_RECOVERY") {
    el("loginBox").classList.add("hidden");
    el("dashboard").classList.add("hidden");
    el("recoveryBox").classList.remove("hidden");
    return;
  }

  if (session && !currentUser && event === "SIGNED_IN") {
    await loadProfile(session.user);
  }
});

async function loadMembers() {
  const list = el("memberList");
  list.textContent = "সদস্য তালিকা লোড হচ্ছে...";

  const {data, error} = await db
    .from("members")
    .select("id, full_name, father_name, phone, address, joining_date")
    .eq("organization_id", organizationId)
    .order("joining_date", {ascending:false});

  if (error) {
    list.textContent = "সদস্য তালিকা লোড হয়নি: " + error.message;
    return;
  }

  el("memberCount").textContent = data.length.toLocaleString("bn-BD");
  list.replaceChildren();

  if (data.length === 0) {
    list.textContent = "এখনো কোনো সদস্য যোগ করা হয়নি।";
    return;
  }

  data.forEach(member => {
    const item = document.createElement("div");
    item.className = "member";

    const name = document.createElement("strong");
    name.textContent = member.full_name || "নাম নেই";
    item.appendChild(name);

    const details = document.createElement("p");
    details.textContent =
      "পিতার নাম: " + (member.father_name || "—") +
      " | মোবাইল: " + (member.phone || "—");
    item.appendChild(details);

    const address = document.createElement("div");
    address.className = "small";
    address.textContent =
      "ঠিকানা: " + (member.address || "—") +
      " | যোগদানের তারিখ: " + (member.joining_date || "—");
    item.appendChild(address);

    list.appendChild(item);
  });
}

el("memberForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!organizationId) {
    showMessage("memberMessage", "সংগঠনের তথ্য পাওয়া যায়নি। আবার লগইন করুন।");
    return;
  }

  const member = {
    organization_id: organizationId,
    full_name: el("fullName").value.trim(),
    father_name: el("fatherName").value.trim(),
    phone: el("phone").value.trim(),
    address: el("address").value.trim(),
    joining_date: el("joiningDate").value
  };

  const {error} = await db.from("members").insert(member);

  if (error) {
    showMessage("memberMessage", "সদস্য সংরক্ষণ হয়নি: " + error.message);
    return;
  }

  showMessage("memberMessage", "সদস্য সফলভাবে যোগ হয়েছে।", false);
  el("memberForm").reset();
  await loadMembers();
});

async function loadSummary() {
  // লেনদেনের তথ্য পাওয়া না গেলে সদস্য তালিকা ব্যবহার করা যাবে।
  const {data, error} = await db
    .from("transactions")
    .select("amount, type")
    .eq("organization_id", organizationId);

  if (error || !data) return;

  let income = 0;
  let expense = 0;

  data.forEach(row => {
    const amount = Number(row.amount) || 0;
    const type = String(row.type || "").toLowerCase();

    if (type.includes("expense") || type.includes("খরচ")) {
      expense += amount;
    } else {
      income += amount;
    }
  });

  el("income").textContent = "৳ " + income.toLocaleString("bn-BD");
  el("expense").textContent = "৳ " + expense.toLocaleString("bn-BD");
}

el("logoutBtn").addEventListener("click", async () => {
  await db.auth.signOut();
  currentUser = null;
  organizationId = null;
  showLogin();
});

// আগে থেকেই লগইন করা থাকলে সেশন পরীক্ষা
(async () => {
  const {data} = await db.auth.getSession();
  if (data.session) {
    await loadProfile(data.session.user);
  }
})();
</script>
</body>
</html>
